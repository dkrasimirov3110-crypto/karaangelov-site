<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дамян Караангелов · Built to connect</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="description" content="Дамян Караангелов – дизайн, брандинг и съдържание от Варна. Социални мрежи и ПР за малкия бизнес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root{
  --stone:#F4F1EA; --plaster:#E7E2D8; --graphite:#1F2023; --concrete:#6B6A66;
  --pink:#EE6FA8; --cobalt:#3D63DD; --lime:#B6D45C; --violet:#7B66C8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stone);color:var(--graphite);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
body.night{background:#14182A;color:#EDEAF2}
#scene{position:fixed;inset:0;display:block;outline:none}
a{color:inherit}

/* Горна лента */
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:20px;padding:18px 28px;z-index:20;pointer-events:none}
header > *{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.01em;text-decoration:none;cursor:pointer;background:none;border:0;color:inherit;font-family:inherit;padding:0}
.logo img{width:34px;height:34px;display:block}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button,.chip{font:600 13px Manrope,sans-serif;border:0;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--graphite)}
body.night nav button,body.night .chip{background:rgba(30,34,56,.75);color:#EDEAF2}
nav button:hover,.chip:hover{background:var(--graphite);color:var(--stone)}
nav button:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Заглавие */
#hero{position:fixed;left:28px;bottom:28px;z-index:10;max-width:440px;pointer-events:none;transition:opacity .6s}
#hero h1{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--pink)}
#hero p{font-size:clamp(20px,2.3vw,28px);line-height:1.25;font-weight:700;margin:0;letter-spacing:-.01em}
#hero .who{font-size:14px;font-weight:500;margin-top:12px;opacity:.7}

/* Долни бутони */
#tools{position:fixed;right:28px;bottom:28px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#counter{font:600 13px Manrope;padding:9px 14px;border-radius:999px;background:var(--graphite);color:var(--stone)}
body.night #counter{background:var(--pink);color:var(--graphite)}

/* Етикети над сградите */
.label{position:fixed;z-index:5;transform:translate(-50%,-100%);font:700 12px Manrope;padding:6px 10px;border-radius:8px;background:var(--graphite);color:var(--stone);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
.label.on{opacity:.92}
.label.seen::after{content:" ✓";color:var(--lime)}
.label.hot{background:var(--pink);color:var(--graphite);opacity:1}

/* Интро */
#intro{position:fixed;left:50%;top:86px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);padding:14px 20px;border-radius:16px;color:var(--graphite);transform:translateX(-50%);z-index:15;text-align:center;font-weight:700;transition:opacity .5s}
#intro .msg{font-size:15px;opacity:.75}
#intro .cta{display:none;margin-top:14px}
.btn{font:700 14px Manrope;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--graphite);color:var(--stone)}
.btn.pink{background:var(--pink);color:var(--graphite)}
.btn.ghost{background:transparent;color:inherit;text-decoration:underline;padding:8px}

/* Панел на проект */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--stone);color:var(--graphite);z-index:30;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
#panel.open{transform:none}
#panel .inner{padding:28px 32px 60px}
#panel .back{margin-bottom:18px}
#panel .district{font:700 12px Manrope;letter-spacing:.08em;text-transform:uppercase;color:var(--concrete)}
#panel h2{font-size:30px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.015em}
#panel .meta{font-size:14px;color:var(--concrete);margin-bottom:14px}
#panel .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
#panel .tag{font:600 12px Manrope;padding:5px 10px;border-radius:999px;background:var(--plaster)}
#panel p,#panel li{font-size:16px;line-height:1.6}
#panel h3{font-size:17px;margin:26px 0 6px}
#panel blockquote{margin:20px 0;padding:16px 18px;border-left:4px solid var(--pink);background:#fff;border-radius:0 12px 12px 0;font-size:16px;line-height:1.55;font-weight:600}
#panel .note{font-size:14px;color:var(--concrete);font-style:italic}
#panel .cover{width:min(100%,320px);border-radius:14px;display:block;margin-bottom:20px}
#panel .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
#panel .gallery figure{margin:0}
#panel .gallery img{width:100%;border-radius:10px;display:block;background:var(--plaster);cursor:zoom-in}
#panel .gallery figcaption{font-size:12px;color:var(--concrete);margin-top:4px;line-height:1.3}
#lightbox{position:fixed;inset:0;background:rgba(20,20,24,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#panel .timeline{list-style:none;padding:0}
#panel .timeline li{padding:8px 0;border-bottom:1px solid var(--plaster)}
#panel .timeline b{display:inline-block;min-width:86px;color:var(--pink)}
#panel .next{margin-top:34px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#panel form{display:grid;gap:10px;margin-top:10px}
#panel input,#panel select,#panel textarea{font:500 15px Manrope;padding:12px 14px;border-radius:10px;border:1.5px solid var(--plaster);background:#fff;color:var(--graphite)}
#panel textarea{min-height:110px;resize:vertical}
#panel .contact-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#panel .status{font-weight:700;color:var(--pink);min-height:1.2em}

/* Само съдържание */
#flat{position:fixed;inset:0;z-index:40;background:var(--stone);color:var(--graphite);overflow-y:auto;display:none}
#flat.open{display:block}
#flat .wrap{max-width:860px;margin:0 auto;padding:90px 24px 60px}
#flat h1{font-size:clamp(34px,6vw,60px);margin:0 0 8px;letter-spacing:-.02em}
#flat .sub{font-size:20px;font-weight:600;margin-bottom:34px}
#flat .card{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:20px 22px;margin-bottom:12px;cursor:pointer;font-family:inherit;color:inherit}
#flat .card:hover{outline:2px solid var(--pink)}
#flat .card small{font-weight:700;color:var(--concrete);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
#flat .card strong{display:block;font-size:20px;margin:4px 0}

#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:50;background:var(--graphite);color:var(--stone);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:760px){
  header{padding:14px 16px}
  nav{display:none}
  #hero{left:16px;right:16px;bottom:118px;max-width:none}
  #hero p{font-size:19px}
  #hero .who{display:none}
  #tools .chip,#counter{padding:8px 11px;font-size:12px}
  #tools{left:16px;right:16px;bottom:16px;justify-content:space-between}
  #panel .inner{padding:22px 20px 60px}
  #panel h2{font-size:25px}
  .label{font-size:11px}
}
@media (prefers-reduced-motion: reduce){ #panel{transition:none} }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<header>
  <button class="logo" id="homeBtn" aria-label="Към началото">
    <img src="assets/logo.png" alt="" width="34" height="34">
    <span>Дамян Караангелов</span>
  </button>
  <nav aria-label="Основно меню">
    <button data-open="zamen">За мен</button>
    <button data-open="dvorec">ДКС</button>
    <button data-open="suvet">Кампус</button>
    <button data-open="markstrat">Лаборатория</button>
    <button data-open="uslugi">Услуги</button>
    <button data-open="kontakt">Контакт</button>
  </nav>
</header>

<div id="intro" role="status">
  <div class="msg">Сглобявам града. Инструкцията я изгубих.</div>
  <div class="cta"><button class="btn pink" id="placeBtn">Да строим</button><br><button class="btn ghost" id="skipBtn">пропусни</button></div>
</div>

<section id="hero">
  <h1>Built to connect</h1>
  <p id="subtitle"></p>
  <div class="who">Дамян Караангелов · Варна</div>
</section>

<div id="tools">
  <span id="counter" aria-live="polite">Разгледани: 0/10</span>
  <button class="chip" id="soundBtn" aria-pressed="false">Нека щрака</button>
  <button class="chip" id="dayBtn">☾ Нощ</button>
  <button class="chip" id="flatBtn">Спести ми строенето</button>
</div>

<aside id="panel" aria-hidden="true" aria-labelledby="pTitle"><div class="inner" id="panelInner"></div></aside>

<section id="flat" aria-label="Цялото съдържание"><div class="wrap" id="flatInner"></div></section>
<div id="toast"></div>
<div id="lightbox"><img alt=""></div>

<noscript><div style="padding:40px;font-size:18px">Дамян Караангелов – дизайн, брандинг и съдържание от Варна.</div></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
